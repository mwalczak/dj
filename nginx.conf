server {
    listen 8080;
    root /usr/share/nginx/html;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /mp3/ {
        types { audio/mpeg mp3; application/zip zip; }
        add_header Cache-Control "public, max-age=604800";
    }

    # rebuilt in place by `djmat.py zip`, so always revalidate
    location = /mp3/dj-set.zip {
        types { application/zip zip; }
        add_header Cache-Control "no-cache";
    }
}
